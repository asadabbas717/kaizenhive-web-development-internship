<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5</title>
</head>
<body>

    <p id="result"></p>

    <script>
        let jsonData = '{"status":200,"message":"OK"}';

        let response = JSON.parse(jsonData);

        if (response.status === 200) {
            document.getElementById("result").innerText = "Request Successful";
        } else {
            document.getElementById("result").innerText = "Request Failed";
        }
    </script>

</body>
</html>
