<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Selection</title>
</head>
<body>

    <form>
        <label>Select Skills:</label>

        <br>

        <input type="checkbox" value="HTML" checked>
        <label>HTML</label>

        <br>

        <input type="checkbox" value="CSS">
        <label>CSS</label>

        <br>

        <input type="checkbox" value="JavaScript" checked>
        <label>JavaScript</label>

        <br>

        <input type="checkbox" value="Database">
        <label>Database</label>
    </form>

</body>
</html>
