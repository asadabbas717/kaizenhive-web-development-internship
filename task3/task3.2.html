<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>
</head>
<body>

    <ul id="courseList">
    </ul>

    <button onclick="addItem()">Add Item</button>

    <script>
        function addItem() {
            let item = document.createElement("li");
            item.innerText = "New Course";

            document.getElementById("courseList").appendChild(item);
        }
    </script>

</body>
</html>
