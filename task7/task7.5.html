<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>

    <style>
        .products {
            display: flex;
            gap: 20px;
        }

        .card {
            border: 1px solid black;
            padding: 20px;
            width: 150px;
        }
    </style>
</head>
<body>

    <div class="products">
        <div class="card">
            <h3>Mouse</h3>
            <p>Rs. 1200</p>
        </div>

        <div class="card">
            <h3>Keyboard</h3>
            <p>Rs. 2500</p>
        </div>

        <div class="card">
            <h3>Monitor</h3>
            <p>Rs. 30000</p>
        </div>
    </div>

</body>
</html>
