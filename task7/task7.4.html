<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Footer</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: lightgray;
            padding: 20px;
        }

        main {
            flex: 1;
            padding: 20px;
        }

        footer {
            background-color: lightgray;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        My Website
    </header>

    <main>
        Welcome
    </main>

    <footer>
        Copyright 2026
    </footer>

</body>
</html>
