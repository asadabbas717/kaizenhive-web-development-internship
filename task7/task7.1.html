<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navigation</title>

    <style>
        nav {
            display: flex;
            justify-content: space-around;
            background-color: lightgray;
            padding: 15px;
        }

        nav a {
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
