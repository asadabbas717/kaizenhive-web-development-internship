<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Layout</title>

    <style>
        .container {
            display: flex;
        }

        .left {
            width: 30%;
            background-color: lightgray;
            padding: 20px;
        }

        .right {
            width: 70%;
            background-color: lightblue;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="left">
            Menu
        </div>

        <div class="right">
            Main Content
        </div>
    </div>

</body>
</html>
